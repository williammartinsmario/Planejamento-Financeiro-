
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Simulador Financeiro Imobiliário Avançado</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<h1>Simulador de Planejamento Financeiro Imobiliário</h1>

<div class="form">

<h2>Financiamento</h2>

<label>Valor do imóvel</label>
<input id="valorImovel" type="number">

<label>Entrada</label>
<input id="entrada" type="number">

<label>Taxa anual (%)</label>
<input id="taxa" type="number" value="8.5">

<label>Prazo (meses)</label>
<input id="prazo" type="number" value="360">

<label>Amortização extra mensal</label>
<input id="extra" type="number" value="0">

<label>FGTS disponível</label>
<input id="fgts" type="number">

<h2>Custos da compra</h2>

<label>Entrada parcelada</label>
<input id="entradaParcelada" type="number">

<label>Meses da entrada</label>
<input id="mesesEntrada" type="number">

<label>ITBI</label>
<input id="itbi" type="number">

<label>Parcelas ITBI</label>
<input id="parcelasITBI" type="number">

<label>Registro</label>
<input id="registro" type="number">

<label>Parcelas Registro</label>
<input id="parcelasRegistro" type="number">

<h2>Simulação de obra (INCC)</h2>

<label>Percentual INCC anual (%)</label>
<input id="incc" type="number" value="4">

<label>Anos de obra</label>
<input id="anosObra" type="number" value="3">

<h2>Valorização do imóvel</h2>

<label>Valorização anual (%)</label>
<input id="valorizacao" type="number" value="6">

<h2>Comparação aluguel</h2>

<label>Valor do aluguel mensal</label>
<input id="aluguel" type="number">

<button onclick="simular()">Simular</button>

</div>

<hr>

<div id="relatorio">

<h2>Resultado</h2>

<div id="resumo"></div>

<h3>Gráfico saldo devedor</h3>
<canvas id="graficoSaldo"></canvas>

<h3>Comparação prazo</h3>
<canvas id="graficoPrazo"></canvas>

<h3>Comparação aluguel vs financiamento</h3>
<canvas id="graficoAluguel"></canvas>

<h3>Tabela amortização</h3>

<table id="tabela">
<thead>
<tr>
<th>Mês</th>
<th>Parcela</th>
<th>Juros</th>
<th>Amortização</th>
<th>Saldo</th>
</tr>
</thead>

<tbody></tbody>

</table>

<div id="timeline"></div>

</div>

<hr>

<button onclick="window.print()">Imprimir</button>
<button onclick="baixarPDF()">PDF</button>
<button onclick="baixarExcel()">Excel</button>

<script src="script.js"></script>

</body>
</html>
