
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Financeiro | WM Imóveis</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<header class="topo">
<img src="logo.png" class="logo">
<h1>Planejamento Financeiro Imobiliário</h1>
</header>

<div class="container">

<div class="card">

<h2>Dados do Financiamento</h2>

<label>Valor do imóvel</label>
<input id="valorImovel" type="number">

<label>Entrada</label>
<input id="entrada" type="number">

<label>Prazo (meses)</label>
<input id="prazo" type="number" value="360">

<label>Amortização extra mensal</label>
<input id="extra" type="number" value="0">

<h2>FGTS</h2>

<label>Saldo atual FGTS</label>
<input id="fgtsAtual" type="number">

<label>Salário mensal</label>
<input id="salario" type="number">

<label>Uso do FGTS</label>
<select id="freqFGTS">
<option value="12">1 ano</option>
<option value="24">2 anos</option>
<option value="36">3 anos</option>
</select>

<button class="btn" onclick="simular()">Simular Planejamento</button>

</div>

<div class="card resultado">

<h2>Resultado da Estratégia</h2>

<div id="resumo"></div>

<canvas id="graficoSaldo"></canvas>
<canvas id="graficoPrazo"></canvas>

<div id="fgtsInfo"></div>

<table id="tabela">
<thead>
<tr>
<th>Mês</th>
<th>Saldo Devedor</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="acoes">
<button onclick="window.print()">Imprimir</button>
<button onclick="baixarPDF()">PDF</button>
<button onclick="baixarExcel()">Excel</button>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
